# Jenkins-only Compose overlay. Invoke it with `docker compose -p <unique-name>`.
# The explicitly named volume prevents CI from ever touching the production save.
services:
  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"

volumes:
  orio-postgres:
    name: ${ORIO_DB_VOLUME:?Set an isolated ORIO_DB_VOLUME for CI}
