name: orio
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orio}
      POSTGRES_USER: ${POSTGRES_USER:-orio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["orio-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    deploy: { resources: { limits: { memory: 384M, cpus: "1.0" } } }
  migrate:
    image: ${ORIO_API_IMAGE:?Set ORIO_API_IMAGE to a published ARM64-compatible image}
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    command: ["sh", "-c", "node dist/server/scripts/migrate.js && node dist/server/scripts/seed.js"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
  api:
    image: ${ORIO_API_IMAGE:?Set ORIO_API_IMAGE to a published ARM64-compatible image}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 20s
    deploy: { resources: { limits: { memory: 256M, cpus: "0.75" } } }
  web:
    image: ${ORIO_WEB_IMAGE:?Set ORIO_WEB_IMAGE to a published ARM64-compatible image}
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 4s
      retries: 3
    deploy: { resources: { limits: { memory: 96M, cpus: "0.35" } } }
volumes:
  orio-postgres:
    name: orio-postgres
